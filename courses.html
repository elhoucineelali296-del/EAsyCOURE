<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a2a3f">
    <title>EAsyCOUR - Matières</title>
    <meta name="description" content="Choisissez une matière pour accéder aux cours, vidéos, exercices et examens.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap"></noscript>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="courses.css">
</head>
<body class="plain">
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="index.html">
                <img src="logo/logo1.png" alt="" onerror="this.style.display='none'">
                <span>EAsyCOUR</span>
            </a>
            <button id="lang-btn" class="lang-btn" type="button" aria-label="Changer de langue / تغيير اللغة">العربية</button>
        </div>
    </header>

    <main>
        <section class="hero hero--compact">
            <div class="hero__inner">
                <a class="back-link" href="home.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
                    <span data-i18n="back">Retour</span>
                </a>
                <h1 data-i18n="title">Vos matières</h1>
                <p data-i18n="intro">Choisissez une matière pour accéder aux cours, vidéos, exercices et examens.</p>
            </div>
        </section>

        <div class="content">
            <section class="panel">
                <div class="level-pill">
                    <span id="level-name"></span>
                    <a href="home.html" data-i18n="change">Changer de niveau</a>
                </div>
                <ul id="subject-grid" class="subject-grid"></ul>
            </section>
        </div>
    </main>

    <footer class="site-footer"><span data-i18n="footer"></span></footer>

    <script src="content.js"></script>
    <script src="shared.js"></script>
    <script>
        if (!EC.level()) {
            location.replace("home.html");
        } else {
            EC.init({
                fr: { title: "Vos matières", intro: "Choisissez une matière pour accéder aux cours, vidéos, exercices et examens.", change: "Changer de niveau", res: "ressources" },
                ar: { title: "موادك الدراسية", intro: "اختر مادة للوصول إلى الدروس والفيديوهات والتمارين والامتحانات.", change: "تغيير المستوى", res: "مورد" }
            }, render);
        }

        function render() {
            var lv = EC.level();
            document.title = "EAsyCOUR - " + EC.t("title");
            document.getElementById("level-name").textContent = EC.levelLabel();
            var list = EASYCOUR.subjects[lv.cycle] || [];
            document.getElementById("subject-grid").innerHTML = list.map(function (s) {
                var n = EC.count(EC.res(s.id));
                return '<li><a class="subject-card" style="--h:' + s.h + '" href="subject.html?s=' + encodeURIComponent(s.id) + '">' +
                    '<span class="subject-card__tile" aria-hidden="true">' + EC.esc(s.ab) + '</span>' +
                    '<span class="subject-card__name">' + EC.esc(EC.tr(s)) + '</span>' +
                    '<span class="subject-card__count">' + (n ? n + " " + EC.t("res") : EC.t("soon")) + '</span></a></li>';
            }).join("");
        }
    </script>
</body>
</html>
